<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Détails de l'avis</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2 th:text="|Avis n°${review.id}|">
      Détails de l'avis
      </h2> 

      <p>
        <strong>Utilisateur :</strong>
        <span th:text="${review.user.login}"></span>
      </p>

      <p>
        <strong>Spectacle :</strong>
        <span th:text="${review.show.title}"></span>
      </p>

      <p>
        <strong>Note :</strong>
        <span th:text="|${review.stars}/5|"></span>
      </p>

      <p>
        <strong>Statut :</strong>
        <span th:text="${review.validated ? 'Validé' : 'En attente'}"></span>
      </p>

      <p>
        <strong>Commentaire :</strong>
        <span th:text="${#strings.isEmpty(review.review) ? 'Aucun commentaire' : review.review}"></span>
      </p>

      <p>
        <strong>Date de création :</strong>
        <span th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
      </p>

      <p>
        <strong>Date de modification :</strong>
        <span th:text="${#temporals.format(review.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
      </p>

      <nav>
        <a th:href="@{/admin/reviews}">
        Retour à la liste des avis
        </a>
      </nav>
    </div>
  </body>
</html>
