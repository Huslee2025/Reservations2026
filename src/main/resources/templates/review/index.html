<!DOCTYPE html>
<html
 lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Gestion des avis</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2>Gestion des avis</h2>

      <p>Liste des avis des utilisateurs</p>

      <table th:unless="${#lists.isEmpty(reviews)}">
        <thead>
          <tr>
            <th>ID</th>
            <th>Utilisateur</th>
            <th>Spectacle</th>
            <th>Note</th>
            <th>Statut</th>
            <th>Date de création</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="review : ${reviews}">
            <td th:text="${review.id}"></td>
            <td th:text="${review.user.login}"></td>
            <td th:text="${review.show.title}"></td>
            <td th:text="|${review.stars}/5|"></td>
            <td th:text="${review.validated ? 'Validé' : 'En attente'}"></td>
            <td th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <a th:href="@{/admin/reviews/{id}(id=${review.id})}">
              Voir
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <p th:if="${#lists.isEmpty(reviews)}">
        Aucun avis trouvé.        
      </p>

      <nav>
        <a th:href="@{/admin}">
        Retour à l'administration
        </a>
      </nav>
      
    </div>
  </body>
  
</html>
