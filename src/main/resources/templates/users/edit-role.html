<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Modifier le rôle</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2>Modifier le rôle d'un utilisateur</h2>

      <p>
        utilisateur :
        <strong th:text="${userLogin}">anna</strong>
      </p>

      <form
        th:action="@{/admin/users/{id}/edit-role(id=${userId})}"
        th:object="${roleForm}"
        method="post"
        >

        <fieldset>
          <legend>Rôles :</legend>

          <div th:each="availableRole : ${roles}">

            <input 
              type="checkbox"
              th:field="*{roles}"
              th:value="${availableRole}" />

            <label
              th:for="${#ids.prev('roles')}"
              th:text="${availableRole.value}">
              Membre
            </label>
            
          </div>

          <p
            th:if="${#fields.hasErrors('roles')}"
            th:errors="*{roles}">
          </p>
        </fieldset>

        <div>
          <button type="submit">Enregistrer</button>
          <a th:href="@{/admin/users}">Annuler</a>
        </div>

      </form>

    </div>
  </body>
</html>
