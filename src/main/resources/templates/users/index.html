<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

<head>
  <title>Gestion des utilisateurs</title>
</head>

<body>
  <div layout:fragment="content">
    <h2>Gestion des utilisateurs</h2>

      <p>
        <a th:href="@{/admin/users/deactivated}">
           Voir les comptes désactivés
        </a>
      </p>


    <p>Liste des comptes utilisateurs actifs.</p>

    <table th:unless="${#lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Login</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.login}"></td>
            <td th:text="${user.firstname}"></td>
            <td th:text="${user.lastname}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role.value}"></td>
            <td>
              <a 
                th:if="${user.role.name() != 'ADMIN'}"
                th:href="@{/admin/users/{id}/edit-role(id=${user.id})}" 
                >
                Modifier le rôle 
              </a>

              <form th:if="${user.role.name() != 'ADMIN'}"
                    th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                    method="post"
                    style="display: inline; margin-left: 12px;">
                <button type="submit"
                        onclick="return confirm('Désactiver ce compte utilisateur ?');">
                        Désactiver
                </button>
                
              </form>
            </td>
          </tr>
        </tbody>
      </table>
      
      <p th:if="${#lists.isEmpty(users)}">
      Aucun utilisateur actif.
      </p>

      <nav>
        <a th:href="@{/admin}">Retour à l'administration</a>
      </nav>
    </div>
  </body>
</html>
