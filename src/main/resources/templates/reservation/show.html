<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">


<head>
  <title>Détails de la réservation</title>
</head>

<body>
  <div layout:fragment="content">

    <h2 th:text="|Réservation n°${reservation.id}|">
      Détails de la réservation
    </h2>

    <p>
      <strong>Utilisateur :</strong>
      <span th:text="${reservation.user.login}">Anna</span>
    </p>

    <p>
      <strong>Prénom :</strong>
      <span th:text="${reservation.user.firstname}">Anna</span>
    </p>

    <p>
      <strong>Nom :</strong>
      <span th:text="${reservation.user.lastname}">Lyse</span>
    </p>

    <p>
      <strong>Date de réservation :</strong>
      <span th:text="${#temporals.format(reservation.bookingDate, 'dd/MM/yyyy HH:mm')}">
        20/11/2026 16:45
        </span>
      </p>

      <p>
        <strong>Statut :</strong>
        <span th:text="${reservation.status}">CONFIRMED</span>
      </p>

      <nav>

        <button type="button" onclick="history.back()">
        Retour
        </button>

        <a th:href="@{/admin/reservations}">
        Retour à la liste des réservations
        </a>
      </nav>
      
    </div>
  </body>
</html>
