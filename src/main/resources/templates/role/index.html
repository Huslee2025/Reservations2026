<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Liste des rôles</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2 th:text="${title}">Liste des rôles</h2>

      <table th:unless="${#lists.isEmpty(roles)}">
        <thead>
          <tr>
            <th>ID</th>
            <th>Rôle</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="role:${roles}">
            <td th:text="${role.id}"></td>
            <td th:text="${role.role}"></td>
            <td>
              <a th:href="@{/roles/{id}(id=${role.id})}">
              View
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <p th:if="${#lists.isEmpty(roles)}">
        Aucun rôle disponible
      </p>
      
    </div>
  </body>
</html>
