<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Fiche d'un rôle</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2 th:text="${title}">Fiche d'un rôle</h2>

      <p>
        <strong>ID :</strong>
        <span th:text="${role.id}">1</span>
      </p>

      <p>
        <strong>Rôle :</strong>
        <span th:text="${role.role}">ADMIN</span>
      </p>

      <a th:href="@{/roles}">Retour à la liste</a>
      
    </div>
  </body>
</html>
