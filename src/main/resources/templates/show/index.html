<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Liste des spectacles</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h1 th:text="${title}">Liste des spectacles</h1>

      <ul th:unless="${#lists.isEmpty(shows)}">

        <li th:each="show : ${shows}">

          <span th:text="${show.title}">Ayiti</span>

          <span
              th:if="${show.bookable}"
              th:text="${show.price} + ' €'">
            9.99 €
          </span>

          <!-- Exactement une représentation -->
          <span th:if="${#lists.size(show.representations) == 1}">
            - 1 représentation
          </span>

          <!-- Plusieurs représentations -->
          <span th:if="${#lists.size(show.representations) > 1}"
                th:text="|- ${#lists.size(show.representations)} représentations|">
            - 2 représentations
          </span>

          <!-- Aucune représentation -->
          <em th:if="${#lists.size(show.representations) == 0}">
            Aucune représentation
          </em>

          <a th:href="@{/shows/{id}(id=${show.id})}">
          View
          </a>

        </li>
        
      </ul>
      
    </div>
  </body>  
</html>
