<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Fiche d'un spectacle</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h1 th:text="${show.title}">Ayiti</h1>

      <p th:if="${show.posterUrl}">
        <img 
          th:src="@{/images/{file}(file=${show.posterUrl})}" 
          th:alt="${show.title}"
          width="200">
      </p>

      <canvas 
        th:unless="${show.posterUrl}"
        width="200"
        height="100"
        style="border:1px solid #000000;">
      </canvas>

      <p th:if="${show.location}">
        <strong>Lieu de création :</strong>
        <span th:text="${show.location.designation}">
          Art center
        </span>
      </p>

      <p>
        <strong>Prix :</strong>
        <span th:text="${show.price} + ' €'">
        9.99
        </span>
      </p>

      <p th:if="${show.bookable}">
        <em>Réservable</em>
      </p>

      <p th:unless="${show.bookable}">
        <em>Non réservable</em>
      </p>

      <nav>
        <a th:href="@{/shows}">Retour à l'index</a>
      </nav>
      
    </div>
  </body>
</html>
