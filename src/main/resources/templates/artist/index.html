<!doctype html>
<html
  lang="fr"
  xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Liste des artistes</title>
  </head>
  <body>
    <div class="container">
      <div id="notification" th:replace="~{main::notification}"></div>
      <div layout:fragment="content">
        <h2 th:text="${title}">Liste des artistes</h2>

        <div class="actions" sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/artists/create}">Add new artist</a>
        </div>

        <table th:unless="${#lists.isEmpty(artists)}">
          <thead>
            <tr>
              <th>Firstname</th>
              <th>Lastname</th>
              <th sec:authorize="hasRole('ADMIN')" colspan="3">Actions</th>
              <th sec:authorize="!hasRole('ADMIN')">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="artist : ${artists}">
              <td th:text="${artist.firstname}">Bob</td>
              <td th:text="${artist.lastname}">Sull</td>
              <td><a th:href="@{/artists/{id}(id=${artist.id})}">View</a></td>
              <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/artists/{id}/edit(id=${artist.id})}">Edit</a>
              </td>
              <td sec:authorize="hasRole('ADMIN')">
                <form
                  th:id="|deleteForm-${artist.id}|"
                  th:action="@{/artists/{id}(id=${artist.id})}"
                  th:method="delete"
                >
                  <a
                    href="#"
                    th:onclick="|if(confirm('Confirm delete artist #${artist.id}')) 
	                    		document.getElementById('deleteForm-${artist.id}').submit(); 
	                    		return false;|"
                    >Delete</a
                  >
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
