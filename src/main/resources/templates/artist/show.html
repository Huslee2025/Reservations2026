<!doctype html>
<html
  lang="fr"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Fiche d’un artiste</title>
  </head>
  <body>
    <div class="container">
      <div id="notification" th:replace="~{main::notification}"></div>
      <div layout:fragment="content">
        <h2 th:text="${artist.firstname} +' '+ ${artist.lastname}">Bob Sull</h2>

        <h2>Liste des types</h2>

        <ul th:unless="${#lists.isEmpty(artist.types)}">
            <li th:each="type : ${artist.types}"
                th:text="${type.type}">
                Type
            </li>
        </ul>

        <div class="actions" sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/artists/{id}/edit(id=${artist.id})}">Edit</a>
          <form
            th:id="|deleteForm-${artist.id}|"
            th:action="@{/artists/{id}(id=${artist.id})}"
            th:method="delete"
          >
            <a
              href="#"
              th:onclick="|if(confirm('Confirm delete artist #${artist.id}')) 
	        		document.getElementById('deleteForm-${artist.id}').submit(); 
	         		return false;|"
              >Delete</a
            >
          </form>
        </div>
        <nav><a th:href="@{/artists}">Retour à l'index</a></nav>
      </div>
    </div>
  </body>
</html>
