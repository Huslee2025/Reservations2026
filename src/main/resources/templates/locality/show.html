<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Fiche d'une localité</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2 th:text="${title}">Fiche d'une localité</h2>

      <p>
        <strong>ID :</strong>
        <span th:text="${locality.id}">1</span>
      </p>

      <p>
        <strong>Code postal :</strong>
        <span th:text="${locality.postalCode}">1000</span>
      </p>

      <p>
        <strong>Localité :</strong>
        <span th:text="${locality.locality}">Bruxelles</span>
      </p>

      <a th:href="@{/localities}">Retour à la liste</a>
      
    </div>
  </body>
</html>
