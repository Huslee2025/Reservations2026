<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

<head>
  <title>Fiche d'une localité</title>
</head>

<body>
  <div layout:fragment="content">

    <h2 th:text="|${locality.postalCode} ${locality.locality}|">
      1000 Bruxelles
    </h2>

    <ul th:unless="${#lists.isEmpty(locality.locations)}">
    <li th:each="location : ${locality.locations}"
        th:text="${location.designation}">
        Dexia Art Center
    </li>
    </ul>

    <p th:if="${#lists.isEmpty(locality.locations)}">
    Aucun lieu de spectacle.
    </p>

    <a th:href="@{/localities}">Retour à la liste</a>

    </div>
  </body>
</html>
