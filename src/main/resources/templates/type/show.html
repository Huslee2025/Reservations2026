<!DOCTYPE html>

<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
  layout:decorate="~{layouts/main}">


  <head>
    <title>Fiche d'un type</title>
  </head>

  <body>
    <div layout:fragment="content">

      <h2 th:text="${title}">Fiche d'un type</h2>
      
      <p>
        <strong>ID :</strong>
        <span th:text="${type.id}">1</span>
      </p>

      <p>
        <strong>Type :</strong>
        <span th:text="${type.type}">Comédien</span>
      </p>

      <a th:href="@{/types}">Retour à la liste</a>

    </div>
  </body>
</html>
