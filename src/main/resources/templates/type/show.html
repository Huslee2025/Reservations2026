<!DOCTYPE html>

<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}">


  <head>
    <title>Fiche d'un type</title>
  </head>

  <body>
    <div layout:fragment="content">

     <h1 th:text="${#strings.capitalize(type.type)}">Comédien</h1>

        <h2>Liste des artistes</h2>

      <ul th:unless="${#lists.isEmpty(type.artists)}">
        <li th:each="artist : ${type.artists}"
            th:text="|${artist.firstname} ${artist.lastname}|">
            Prénom Nom
        </li>
      </ul>

      <a th:href="@{/types}">Retour à la liste</a>

    </div>
  </body>
</html>
