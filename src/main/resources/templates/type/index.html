<!DOCTYPE html>
<html
  lang="fr"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
  layout:decorate="~{layouts/main}">

  <head>
    <title>Liste des types</title>
  </head>

  <body>
      <div layout:fragment="content">

        <h2 th:text="${title}">Liste des types</h2>

      <table th:unless="${#lists.isEmpty(types)}">
        <thead>

          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="type:${types}">
            <td th:text="${type.id}"></td>
            <td th:text="${type.type}"></td>
            <td>
              <a th:href="@{/types/{id}(id=${type.id})}">
                View
              </a>
            </td>
          </tr>
        </tbody>
        </table>

      <p th:if="${#lists.isEmpty(types)}">
        Aucun type disponible
      </p>
        
      </div>
  </body>
</html>
