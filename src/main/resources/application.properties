spring.application.name=Reservations-Spring-Boot


# URL de connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/reservations?sslMode=REQUIRED&serverTimezone=Europe/Brussels

# Identifiants de connexion
spring.datasource.username = root
spring.datasource.password = ${DB_PASSWORD}


# Driver MySQL (optionnel, géré automatiquement par Spring Boot)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuration Hibernate / JPA
# 'update' crée ou met à jour les tables automatiquement (pratique en développement)
# spring.jpa.hibernate.ddl-auto=update


# Affiche les requêtes SQL dans la console (pratique pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Désactiver la création automatique de Hibernate pour laisser la main à Flyway
spring.jpa.hibernate.ddl-auto=none

# 2. Activer explicitement Flyway (activé par défaut si le starter est présent)
spring.flyway.enabled=true

# 3. Permettre l'initialisation si votre base de données contient déjà des tables
spring.flyway.baseline-on-migrate=true
